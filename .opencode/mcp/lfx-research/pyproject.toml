[project]
name = "lfx-research-mcp"
version = "0.1.0"
description = "Portable LFX research MCP for crisol-definitive — stateless lfx run with isolated knowledge-library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=1.0",
  "lfx>=1.0",
  "python-dotenv>=1.0",
]

[project.scripts]
lfx-research-mcp = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
